# Builds both apps and runs both test projects on every push and pull request. ARM64 runner: Inkvolt PDF's projects
# default to win-arm64 (pdf/Directory.Build.props), the same as the machine they're developed on.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Inkvolt.slnx -c Release

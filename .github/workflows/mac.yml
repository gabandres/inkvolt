# Builds the macOS code on pushes that touch it: the package (PrintCore and PrintMac, tested), the app, and
# Inkvolt PDF's package (PdfCore over MuPDF, tested).
# The Windows PC builds PrintCore only, so this is the first check of everything that imports an Apple framework.
name: mac

on:
  push:
    paths: ['mac/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The newest Xcode 26 on the runner (App Store uploads need its SDK; the owner's Mac has it), else the default.
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swift --version
      # A rounded Double turned into an Int traps on NaN, infinity or a huge value: checked form or a // bounded: reason.
      - run: sh mac/tools/check-int.sh
      - run: swift test --package-path mac/InkvoltPrintKit -Xswiftc -warnings-as-errors
      - run: xcodebuild -project mac/InkvoltPrint/InkvoltPrint.xcodeproj -scheme InkvoltPrint -configuration Release -destination generic/platform=macOS -quiet build CODE_SIGNING_ALLOWED=NO # warnings are errors in the app target

  # Inkvolt PDF's package over MuPDF: MuPDF built from its source by mac/Vendor/mupdf/build.sh, kept between runs until
  # the script changes (a fresh build takes most of this job's time).
  pdf:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        args: ['', '--skip TranslationHostileTests', '--filter TranslationHostileTests']
    steps:
      - uses: actions/checkout@v7
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
      - id: mupdf
        uses: actions/cache@v6
        with:
          path: mac/InkvoltPdfKit/Frameworks
          key: mupdf-${{ runner.os }}-${{ hashFiles('mac/Vendor/mupdf/build.sh') }}
      - if: steps.mupdf.outputs.cache-hit != 'true'
        run: sh mac/Vendor/mupdf/build.sh
      - name: hunt
        run: |
          sysctl hw.memsize hw.ncpu; df -h /
          swift build --package-path mac/InkvoltPdfKit --build-tests -Xswiftc -warnings-as-errors
          ( while true; do echo "== $(date +%T) $(sysctl -n vm.page_free_count) free pages; $(df -h / | tail -1)"; memory_pressure -Q | tail -1; ps -axo rss=,comm= -m | head -4; sleep 10; done ) > mem.log 2>&1 &
          set +e
          swift test --package-path mac/InkvoltPdfKit --skip-build ${{ matrix.args }} -Xswiftc -warnings-as-errors > out.log 2>&1
          code=$?
          echo "swift test exit $code"
          tail -40 out.log
          grep -E "✘|error:|Test run with" out.log | head -40
          echo "== mem"; tail -120 mem.log
          echo "== kills"; log show --last 30m --style compact --predicate 'eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "swiftpm-testing" OR eventMessage CONTAINS[c] "InkvoltPdfKitPackageTests"' 2>&1 | tail -60
          echo "== reports"; ls -la ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>&1 | tail -20
          for f in ~/Library/Logs/DiagnosticReports/*; do [ -f "$f" ] && head -60 "$f"; done
          exit $code
      - run: swift build --package-path mac/InkvoltPdf -c release -Xswiftc -warnings-as-errors # the app

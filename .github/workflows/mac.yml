# Builds the macOS code on pushes that touch it: the probe, the package (PrintCore and PrintMac, tested) and the app.
# The Windows PC builds PrintCore only, so this is the first check of everything that imports an Apple framework.
name: mac

on:
  push:
    paths: ['mac/**', '.github/workflows/mac.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The newest Xcode 26 on the runner (App Store uploads need its SDK; the owner's Mac has it), else the default.
      - run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swift --version
      - run: swift build --package-path mac/Probe -Xswiftc -warnings-as-errors
      - run: swift test --package-path mac/InkvoltPrintKit -Xswiftc -warnings-as-errors
      - run: swift build --package-path mac/InkvoltPrint -Xswiftc -warnings-as-errors
